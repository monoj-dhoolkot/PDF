services:
  squeezely:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      MAX_FILE_BYTES: 31457280
      MAX_BATCH: 12
      MAX_QUEUED_JOBS: 100
      RETENTION_MINUTES: 30
      WORKER_CONCURRENCY: 2
    volumes:
      - squeezely-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0

volumes:
  squeezely-data:
